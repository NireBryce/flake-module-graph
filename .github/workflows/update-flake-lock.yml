name: update flake.lock
# Monthly: move nixpkgs forward and open a PR, which CI then checks like any
# other. Landing it is still the usual review (skill `ship`).
on:
  schedule:
    - cron: '17 6 3 * *'      # 06:17 UTC on the 3rd of each month
  workflow_dispatch:
permissions:
  contents: write             # push the branch
  pull-requests: write        # open the PR
  actions: write              # start check.yml on it
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: nix flake update
        run: nix flake update 2>&1 | tee update.log
      - name: open a PR if the lock moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet flake.lock; then echo 'flake.lock is current'; exit 0; fi
          branch="chore/flake-lock-$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -q flake.lock -m 'chore: update flake.lock' -m "$(grep -v '^warning: ' update.log)"
          git push -u origin "$branch"
          {
            # shellcheck disable=SC2016  # backticks are Markdown, not a command
            echo 'Automated monthly `nix flake update`.'
            echo
            grep -v '^warning: ' update.log | sed 's/^/    /'
            echo
            echo 'CI (check.yml) decides: the saved views in tests/expected/golden/ must not move.'
          } > body.md
          # Needs Settings > Actions > General > "Allow GitHub Actions to create
          # and approve pull requests"; without it the branch is still pushed.
          gh pr create --base main --head "$branch" --title "chore: update flake.lock ($(date -u +%Y-%m-%d))" --body-file body.md \
            || { echo "::error::pushed $branch but could not open its PR: allow GitHub Actions to create pull requests, or open it by hand"; exit 1; }
          # A PR opened with this workflow's token starts no workflows of its
          # own; a dispatch does, and its results show on the PR's commit.
          gh workflow run check.yml --ref "$branch"
