name: check
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: just preflight (unit tests, the page in headless Chromium, flake check)
        run: nix develop --command just preflight
      # Pinned, so a push there can't turn this repository red: bump the
      # revision on purpose, with any change the new graph needs here.
      - name: end to end with the graph dirs-as-categories publishes
        env:
          DIRS_AS_CATEGORIES: github:NireBryce/dirs-as-categories/f2c44941d0cf4866cf25d1868c39bb04965dcd41
        run: |
          nix eval --json "$DIRS_AS_CATEGORIES#tests.main" --apply 'm: m.graph' > graph.json
          nix run . -- hosts graph.json | grep -q 'enables'
          nix run . -- html graph.json | grep -q '"title":"hm-agg"'
