name: check
on:
  push:
    branches: [main]          # a branch's pushes are checked through its PR
  pull_request:
  workflow_dispatch:          # update-flake-lock.yml starts it on the PRs it opens
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Actions are pinned by commit; Dependabot (.github/dependabot.yml) bumps
# both the hash and the version comment.
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix flake check
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: just preflight (unit tests, saved views, the page in headless Chromium, flake check, end to end)
        run: nix develop --command just preflight
